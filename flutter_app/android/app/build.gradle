plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

android {
    namespace = "com.quickpass.app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    defaultConfig {
        applicationId = "com.quickpass.app"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def propsFile = rootProject.file('key.properties')
            def props = new Properties()
            if (propsFile.exists()) {
                props.load(new FileInputStream(propsFile))
            }
            keyAlias = props['keyAlias'] ?: System.getenv('KEY_ALIAS') ?: ''
            keyPassword = props['keyPassword'] ?: System.getenv('KEY_PASSWORD') ?: ''
            storeFile = props['storeFile'] ? file(props['storeFile']) : (System.getenv('KEYSTORE_PATH') ? file(System.getenv('KEYSTORE_PATH')) : null)
            storePassword = props['storePassword'] ?: System.getenv('STORE_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig = rootProject.file('key.properties').exists() || System.getenv('KEYSTORE_PATH') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    dependencies {
        coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
        implementation platform("androidx.compose:compose-bom:2024.02.01")
        implementation "androidx.compose.ui:ui"
        implementation "androidx.compose.ui:ui-graphics"
        implementation "androidx.compose.ui:ui-tooling-preview"
        implementation "androidx.compose.material3:material3"
        implementation "androidx.compose.material:material-icons-extended"
        implementation "androidx.activity:activity-compose:1.8.2"
        implementation "com.google.android.material:material:1.12.0"
        debugImplementation "androidx.compose.ui:ui-tooling"
    }
}

flutter {
    source = "../.."
}
