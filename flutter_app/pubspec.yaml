name: quickpass
description: Quickpass - Smart Gatepass & Leave Management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.27.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  dio: ^5.4.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.11
  flutter_secure_storage: ^9.2.2
  google_fonts: ^8.1.0
  jailbreak_root_detection: ^1.2.0+1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  json_annotation: ^4.9.0
  shared_preferences: ^2.0.5
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  firebase_crashlytics: ^4.3.0
  firebase_analytics: ^11.4.0
  connectivity_plus: ^6.1.0
  crypto: ^3.0.6
  device_info_plus: ^11.3.3
  table_calendar: ^3.1.2
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  mockito: ^5.6.0
  build_runner: ^2.4.0
  json_serializable: ^6.8.0
  coverage: ^1.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app-icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_padding: 0.12
