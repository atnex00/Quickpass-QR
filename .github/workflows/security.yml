name: Security Scan

on: [push, pull_request]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit backend
        run: |
          cd backend
          npm ci
          npm audit --audit-level=high
      - name: Audit web
        run: |
          cd web
          npm ci
          npm audit --audit-level=high
