name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: passlynx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/passlynx
          NODE_ENV: test
        run: npm run migrate

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/passlynx
          NODE_ENV: test
        run: npm test

      - name: Run web tests
        working-directory: web
        run: npm test

      - name: Run Flutter analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: flutter_app
        run: flutter test

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend lint
        working-directory: backend
        run: npm run lint

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run web lint
        working-directory: web
        run: npm run lint
